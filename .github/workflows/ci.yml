name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-test:
    name: Python Tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Python unit tests
        run: |
          python -m unittest discover -s tests -v

  swift-test:
    name: macOS Swift & App Build
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run PPTAlertPolicy regression test
        run: |
          bash tests/swift/run_ppt_alert_policy_tests.sh

      - name: Build macOS SwiftUI App Bundle
        run: |
          bash scripts/build_mac_app.sh

  native-windows-build:
    name: Windows origin-bridge Cross-Compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MinGW cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Build origin-bridge.exe
        run: |
          bash scripts/build_origin_bridge.sh
