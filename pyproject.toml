[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slidebridge"
version = "0.1.0"
description = "Repair PowerPoint metafile previews while preserving embedded OLE data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
slidebridge = "slidebridge.cli:main"

[tool.setuptools.packages.find]
include = ["slidebridge*"]
